<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <nav class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md">
  <h1 class="text-xl font-bold">Aplikasi Kasir POS</h1>
  <div class="flex items-center gap-2">
    <a href="/users.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg text-sm">Kelola User</a>
    <a href="/barang.html" class="bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg text-sm">Kelola Barang</a>
    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-lg text-sm">Logout</button>
  </div>
</nav>

  

  <div class="p-6 max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Daftar Produk -->
    <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm">
      <h2 class="text-lg font-bold mb-4">Pilih Produk</h2>
      <div id="produkGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
    </div>

    <!-- Keranjang Belanja -->
    <div class="bg-white p-6 rounded-xl shadow-sm flex flex-col justify-between">
      <div>
        <h2 class="text-lg font-bold mb-4">Keranjang</h2>
        <div id="keranjangList" class="space-y-3 max-h-80 overflow-y-auto mb-4"></div>
      </div>
      <div class="border-t pt-4 space-y-3">
        <div class="flex justify-between text-lg font-bold">
          <span>Total:</span>
          <span id="totalHarga">Rp 0</span>
        </div>
        <div>
          <label class="block text-sm text-gray-600">Bayar (Rp):</label>
          <input type="number" id="inputBayar" oninput="hitungKembali()" class="w-full border p-2 rounded-lg">
        </div>
        <div class="flex justify-between text-sm text-gray-600">
          <span>Kembalian:</span>
          <span id="textKembali">Rp 0</span>
        </div>
        <button onclick="prosesBayar()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-lg">Proses Transaksi</button>
      </div>
    </div>
  </div>

  <script>
    let produkList = [];
    let keranjang = [];

    async function loadProduk() {
      const res = await fetch('/api/produk');
      produkList = await res.json();
      const grid = document.getElementById('produkGrid');
      grid.innerHTML = produkList.map(p => `
        <div onclick="tambahKeranjang(${p.id})" class="border p-4 rounded-lg cursor-pointer hover:border-blue-500 transition bg-slate-50">
          <p class="font-bold">${p.nama_barang}</p>
          <p class="text-sm text-slate-500">Stok: ${p.stok}</p>
          <p class="text-blue-600 font-bold mt-2">Rp ${p.harga_jual.toLocaleString()}</p>
        </div>
      `).join('');
    }

    function tambahKeranjang(id) {
      const p = produkList.find(x => x.id === id);
      const item = keranjang.find(x => x.id === id);
      if (item) {
        if (item.jumlah < p.stok) item.jumlah++;
      } else {
        keranjang.push({ ...p, jumlah: 1 });
      }
      renderKeranjang();
    }

    function renderKeranjang() {
      const container = document.getElementById('keranjangList');
      container.innerHTML = keranjang.map(i => `
        <div class="flex justify-between items-center text-sm border-b pb-2">
          <div>
            <p class="font-semibold">${i.nama_barang}</p>
            <p class="text-xs text-gray-500">x${i.jumlah}</p>
          </div>
          <p class="font-bold">Rp ${(i.harga_jual * i.jumlah).toLocaleString()}</p>
        </div>
      `).join('');

      const total = keranjang.reduce((sum, i) => sum + (i.harga_jual * i.jumlah), 0);
      document.getElementById('totalHarga').innerText = 'Rp ' + total.toLocaleString();
      hitungKembali();
    }

    function hitungKembali() {
      const total = keranjang.reduce((sum, i) => sum + (i.harga_jual * i.jumlah), 0);
      const bayar = Number(document.getElementById('inputBayar').value) || 0;
      const kembali = bayar - total;
      document.getElementById('textKembali').innerText = 'Rp ' + (kembali > 0 ? kembali.toLocaleString() : 0);
    }

    async function prosesBayar() {
      const total = keranjang.reduce((sum, i) => sum + (i.harga_jual * i.jumlah), 0);
      const bayar = Number(document.getElementById('inputBayar').value);
      if (bayar < total) return alert('Uang pembayaran kurang!');

      const no_faktur = 'INV-' + Date.now();
      const res = await fetch('/api/transaksi', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          no_faktur, total_harga: total, bayar, kembali: bayar - total, items: keranjang
        })
      });

      if (res.ok) {
        alert('Transaksi Berhasil!');
        keranjang = [];
        document.getElementById('inputBayar').value = '';
        renderKeranjang();
        loadProduk();
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/index.html';
    }

    loadProduk();
  </script>
</body>
</html>
