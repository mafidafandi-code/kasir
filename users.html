<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Pengguna - POS System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Header / Navbar Tema Seragam -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white font-bold flex items-center justify-center text-base shadow-sm">
          P
        </div>
        <div>
          <h1 class="font-bold text-slate-900 leading-none text-base">Manajemen Pengguna</h1>
          <p class="text-[11px] text-slate-400 font-medium">Kontrol Akses Kasir & Admin</p>
        </div>
      </div>
      <a href="/index.html" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Kembali ke Kasir
      </a>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-6">
    
    <!-- Form Tambah User Card -->
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
      <h2 class="text-base font-bold text-slate-900 mb-4">Tambah Pengguna Baru</h2>
      <form id="formUser" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3.5 items-end text-xs">
        <div>
          <label class="block font-semibold text-slate-600 mb-1">Username</label>
          <input type="text" id="username" placeholder="cth: budi_kasir" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block font-semibold text-slate-600 mb-1">Password</label>
          <input type="password" id="password" placeholder="••••••••" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block font-semibold text-slate-600 mb-1">Nama Lengkap</label>
          <input type="text" id="nama_lengkap" placeholder="Nama Lengkap" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block font-semibold text-slate-600 mb-1">Peran / Role</label>
          <select id="peran" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500">
            <option value="kasir">Kasir</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl transition shadow-md shadow-indigo-100 flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Simpan
          </button>
        </div>
      </form>
    </div>

    <!-- Tabel Daftar User Card -->
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
      <div class="mb-4">
        <h2 class="text-base font-bold text-slate-900">Daftar Akun Pengguna</h2>
        <p class="text-xs text-slate-400">Akun kasir dan admin yang terdaftar di sistem</p>
      </div>

      <div class="overflow-x-auto rounded-xl border border-slate-100 max-h-[60vh]">
        <table class="w-full text-left border-collapse text-xs">
          <thead class="sticky top-0 bg-slate-50 text-slate-600 font-semibold border-b border-slate-200">
            <tr>
              <th class="p-3.5">Username</th>
              <th class="p-3.5">Nama Lengkap</th>
              <th class="p-3.5">Peran</th>
            </tr>
          </thead>
          <tbody id="tabelUser" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Script Logika -->
  <script>
    async function loadUsers() {
      try {
        const res = await fetch('/api/users');
        const data = await res.json();
        
        const tbody = document.getElementById('tabelUser');
        if (!data || !data.length) {
          tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-slate-400">Belum ada pengguna terdaftar</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map(u => `
          <tr class="hover:bg-slate-50/80 transition">
            <td class="p-3.5 font-mono font-semibold text-slate-700">${u.username}</td>
            <td class="p-3.5 font-bold text-slate-800">${u.nama_lengkap}</td>
            <td class="p-3.5">
              <span class="px-2.5 py-1 rounded-lg text-[11px] font-bold uppercase tracking-wider ${u.peran === 'admin' ? 'bg-purple-50 text-purple-600 border border-purple-100' : 'bg-indigo-50 text-indigo-600 border border-indigo-100'}">
                ${u.peran}
              </span>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Gagal mengambil data user:', err);
      }
    }

    document.getElementById('formUser').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        nama_lengkap: document.getElementById('nama_lengkap').value,
        peran: document.getElementById('peran').value
      };

      const res = await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      if (res.ok) {
        document.getElementById('formUser').reset();
        loadUsers();
        alert('Pengguna berhasil ditambahkan!');
      } else {
        alert(data.message || 'Gagal menambahkan pengguna');
      }
    });

    loadUsers();
  </script>
</body>
</html>
